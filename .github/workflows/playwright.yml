name: Playwright Tests
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  calidad:
    name: Calidad de código (typecheck + lint + formato)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run validar

  test:
    name: Tests E2E
    needs: calidad
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      AMBIENTE: qa
      BASE_URL: ${{ secrets.BASE_URL }}
      QA_EMAIL: ${{ secrets.QA_EMAIL }}
      QA_PASSWORD: ${{ secrets.QA_PASSWORD }}
      QA_COMPANY: ${{ secrets.QA_COMPANY }}
      QA_RUT_PRUEBA1: ${{ secrets.QA_RUT_PRUEBA1 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - name: Instalar navegadores de Playwright
        run: npx playwright install --with-deps chromium
      - name: Ejecutar tests
        run: npx playwright test
      - name: Generar reporte Allure
        if: ${{ !cancelled() }}
        run: npm run reporte:allure:generar
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: reports
          path: reports/
          retention-days: 30
